[workspace]
members = ["ghostwave-core", "ghostwave-vst"]
resolver = "2"

[package]
name = "ghostwave"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Professional AI-powered audio processing with RTX GPU acceleration - NVIDIA Broadcast for Linux"
authors = ["Christopher Kelley <ckelley@ghostkellz.sh>"]
repository = "https://github.com/ghostkellz/ghostwave"
homepage = "https://github.com/ghostkellz/ghostwave"
documentation = "https://docs.rs/ghostwave"
readme = "README.md"
keywords = ["audio", "noise-reduction", "rtx", "pipewire", "broadcast"]
categories = ["multimedia::audio", "hardware-support"]
exclude = ["docs/", "tests/", ".github/"]

[dependencies]
ghostwave-core = { path = "./ghostwave-core", features = ["pipewire-backend", "alsa-backend", "jack-backend", "cpal-backend"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pipewire = "0.10"
cpal = "0.18"
crossbeam = "0.8"
libc = "0.2"
alsa = "0.11"
jack = "0.13"
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
dasp = { version = "0.11", features = ["signal", "interpolate", "ring_buffer"] }
dirs = "6.0"
uuid = { version = "1.0", features = ["v4"] }

# NVIDIA RTX acceleration (optional feature)
[dependencies.cudarc]
version = "0.19"
optional = true
default-features = false
features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-version-from-build-system"]

[features]
default = []
# RTX acceleration - can be explicitly enabled or auto-detected via build.rs
# When CUDA is detected at build time, `has_cuda` cfg is set automatically
nvidia-rtx = ["cudarc", "ghostwave-core/nvidia-rtx"]

[build-dependencies]
# No external dependencies needed for build.rs
